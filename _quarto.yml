project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - experiments/*.qmd

execute:
  echo: false
  warning: false

website:
  title: "Awards Patterns"
  site-url: https://juliakm.com/awards-patterns/
  description: "Experiments on Oscar history for movie fans."
  search: false
  navbar:
    left:
      - href: index.qmd
        text: Experiments
      - href: about.qmd
        text: About
  page-footer:
    left: "An independent fan project. Not affiliated with the Academy."

format:
  html:
    lang: en
    theme: cosmo
    toc: false
    anchor-sections: true
    smooth-scroll: false
