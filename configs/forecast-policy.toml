policy_version = "1.0.0"
status = "specification_only"
target = "announced_nominee_win_probability"
documentation = "docs/forecast-policy.md"

[cutoffs]
schedule_timezone = "America/Los_Angeles"
require_verified_aware_schedule_timestamps = true
early_read_elapsed_hours_after_nominations = 24
early_read_availability_operator = "<="
primary_boundary = "final_voting_starts_at"
primary_availability_operator = "<"
other_interim_cutoffs = "unvalidated"

[availability]
strict_timestamp_status = "verified"
require_evidence_reference = true
unknown_or_date_only = "exclude_from_strict"
retrieval_time_is_availability = false
retrospective_label = "retrospective_non_deployable"

[identity]
year_basis = "ceremony_year"
contest_key = ["ceremony_id", "category_id"]
prediction_entry_key = "ballot_entry_id"
category_rules = "independently_verified_ceremony_specific_registry"
preserve_original_category_labels = true
sparse_category_output = "baseline_or_explicitly_experimental_with_coverage"

[artifacts]
required_prediction_fields = [
  "ceremony_id", "category_id", "ballot_entry_id", "forecast_product",
  "cutoff_at", "cutoff_operator", "policy_version", "model_version",
  "data_snapshot_id", "probability", "reliability_status",
]
snapshot_identity = "immutable_manifest_sha256"
snapshot_manifest_fields = [
  "source_id", "source_version", "source_sha256", "retrieved_at",
  "availability_evidence", "timestamp_status",
]

[missingness]
states = ["not_nominated", "event_not_yet_held", "category_not_applicable", "source_missing"]
unknown_timestamp = "source_missing_with_timestamp_reason"
zero_is_not_missing = true
precursors = "mapped_contest_only"

[ties]
official_winner_accuracy = "any_official_winner"
probability_target = "equal_mass_across_official_winners"
sensitivity = "exclude_official_tied_winner_contests"
training = "freeze_declared_policy_before_model_comparison"
top_probability_ties = "lowest_stable_ballot_entry_id_and_report_tie_count"

[evaluation]
initial_training_years = [2010, 2011, 2012, 2013, 2014, 2015, 2016]
development_years = [2017, 2018, 2019, 2020, 2021, 2022, 2023]
quarantined_test_years = [2024, 2025, 2026]
split_unit = "ceremony"
development_folds = "expanding_window_one_season_ahead"
random_nominee_row_splits = "prohibited"
test_inspection_before_freeze = "data_quality_and_coverage_only"
test_evaluation = "frozen_sequential_one_season_ahead"
selection_cutoff = "primary"
early_read_reporting = "separate_with_precursor_timing_sparsity"
numeric_selection_criteria = "must_be_preregistered_before_opening_test"
development_uncertainty = "ceremony_bootstrap"
final_test_uncertainty = "per_year_paired_contest_differences_no_ceremony_bootstrap"
refit = "eligible_2010_2026_only_after_frozen_test_reporting"

[season_2027]
schedule_status = "provisional_requires_official_academy_verification"
provisional_early_read_calendar_label = "January 22, 2027"
early_read_at_status = "unknown_until_nomination_announcement_time_verified"
final_voting_starts_at_status = "unknown_until_official_schedule_verified"
execution_gate = "verify_both_schedule_instants_and_record_official_evidence"
