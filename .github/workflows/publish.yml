name: Publish approved Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Renaming/publication approval and Pages settings are separate release steps.
    if: github.ref == 'refs/heads/main' && github.repository == 'juliakm/awards-patterns' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.16"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.10.20"
          tinytex: false
      - name: Restore locked environment and record versions
        run: |
          uv sync --locked
          python --version
          uv --version
          quarto --version
          git rev-parse HEAD
      - name: Test and lint
        run: |
          uv run --locked python -m pytest
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Render and check the site
        run: |
          quarto render
          uv run --locked python scripts/check_site.py
      - name: Upload only the checked site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.repository == 'juliakm/awards-patterns' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy guarded artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
