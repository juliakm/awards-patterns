[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oscar-patterns"
version = "0.1.0"
description = "Reproducible analysis for the Awards Patterns project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "duckdb==2.0.0",
    "scikit-learn==1.9.1",
    "plotly==7.1.0",
    "jupyter==1.1.1",
    "httpx==0.28.1",
]

[project.scripts]
oscar-data = "oscar_patterns.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oscar_patterns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".tools", "_freeze", "_site", "data", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
